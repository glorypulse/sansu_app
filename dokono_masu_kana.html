<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>どこのマスかな？</title>
<style>
  :root { color-scheme: light; --green:#27865a; --ink:#26332d; --soft:#f3f7f3; --line:#d6e2d8; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 14px 36px; font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; color:var(--ink); background:#fbfcfa; }
  main { max-width:680px; margin:auto; }
  h1 { font-size:clamp(1.4rem,5vw,2rem); margin:0 0 6px; }
  .sub { color:#65736a; margin:0 0 20px; font-size:.95rem; }
  .panel { background:white; border:1px solid var(--line); border-radius:18px; padding:16px; margin:14px 0; box-shadow:0 2px 8px #1d43200a; }
  .settings { display:flex; flex-wrap:wrap; align-items:center; gap:12px 18px; }
  label { display:flex; gap:7px; align-items:center; font-size:.95rem; }
  select, button { font:inherit; border-radius:10px; border:1px solid #bdcfc1; padding:9px 12px; background:white; color:var(--ink); }
  button { cursor:pointer; font-weight:650; }
  button.primary { background:var(--green); border-color:var(--green); color:white; }
  button:focus-visible, select:focus-visible { outline:3px solid #a9d8bb; outline-offset:2px; }
  .question { text-align:center; font-size:clamp(1.2rem,4vw,1.55rem); font-weight:750; line-height:1.6; }
  .board-wrap { display:flex; justify-content:center; padding:8px 0 14px; }
  .board { display:grid; gap:7px; width:min(100%,440px); }
  .cell { aspect-ratio:1; border:2px solid #d8e4da; border-radius:13px; background:#fff; display:grid; place-items:center; font-size:clamp(2rem,9vw,3.2rem); cursor:pointer; user-select:none; transition:background .15s,border-color .15s,transform .15s; }
  .cell:active { transform:scale(.97); }
  .cell.row-hint { background:#e7f4e9; border-color:#79b98b; }
  .cell.target { background:#c9ebd2; border:3px solid var(--green); }
  .cell.chosen { outline:4px solid #f0b84b; outline-offset:1px; }
  .cell:disabled { cursor:default; }
  .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; }
  .status { min-height:2.6em; text-align:center; font-weight:650; margin:12px 0 0; }
  .help { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
  .muted { color:#66736a; font-size:.88rem; }
  .step { display:inline-block; border-radius:999px; padding:4px 10px; background:#eef5ef; color:#286342; font-size:.85rem; font-weight:700; margin-bottom:8px; }
  .hidden { display:none !important; }
  footer { text-align:center; color:#7a867e; font-size:.8rem; margin-top:20px; }
  .row-choice { grid-column:1 / -1; display:flex; justify-content:space-around; min-height:72px; font-size:2rem; border:2px solid var(--line); }
  .row-hint { background:#e7f4e9; border:3px solid #27865a; }
  .chosen { outline:4px solid #dc981a; outline-offset:1px; }
  .single-vertical { max-width:80px; }
  .retained { text-align:center; color:#286342; margin:4px 0; min-height:1.5em; }
  button:disabled { cursor:default; }
  .actions button:disabled, .help button:disabled { opacity:.5; }
  .cell:disabled:not(.row-hint):not(.target) { background:#f0f2f0; }
</style>
</head>
<body>
<main>
  <h1>どこのマスかな？</h1>
  <p class="sub">たて・よこの場所を組み合わせて、くだものを見つけよう。</p>

  <section class="panel settings" aria-label="問題の設定">
    <label>レベル
      <select id="level"><option value="1">Lv.1 ひとつの向き</option><option value="2" selected>Lv.2 段からマスへ</option><option value="3">Lv.3 ふたつの条件</option></select>
    </label>
    <label>マスの大きさ
      <select id="size"><option value="3">3 × 3</option><option value="4">4 × 4</option></select>
    </label>
    <label>ヒント
      <select id="hintMode"><option value="step">段階的にヒントを出す</option><option value="none">ヒントなし</option></select>
    </label>
    <label><input id="speak" type="checkbox"> 問題を読み上げる</label>
  </section>

  <section class="panel">
    <div class="step" id="stepLabel">もんだい</div>
    <div class="question" id="question" aria-live="polite">上から2ばんめ、左から3ばんめはどこ？</div>
    <p id="retained" class="retained"></p>
    <div class="board-wrap"><div class="board" id="board" aria-label="くだもののマス目"></div></div>
    <div class="actions">
      <button id="hintBtn">ヒント</button>
      <button class="primary" id="checkBtn">こたえあわせ</button>
      <button id="nextBtn">つぎのもんだい</button>
    </div>
    <p class="status" id="status" aria-live="polite">答えだと思うマスをタップしてね。</p>
    <div class="help">
      <button id="listenBtn">もういちど きく</button>
      <button id="resetBtn">えらびなおす</button>
      <button id="answerBtn">こたえを見る</button>
    </div>
  </section>

  <section class="panel">
    <strong>ヒントの使い方</strong>
    <p class="muted" style="margin-bottom:0">1回目：指定された「段」を色で示します。<br>2回目：その段の中で、指定された「列」を示します。<br>ヒントなしにも切り替えられます。</p>
  </section>
  <footer>問題は毎回ランダムに作られます。何度でも遊べます。</footer>
</main>
<script>
(() => {
  const fruits = ['🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🫐','🍒','🍑','🥝','🍍','🥭','🥥','🍈'];
  const $ = id => document.getElementById(id);
  const rand = n => Math.floor(Math.random() * n);
  let problem, state;
  const targetIndex = () => problem.row * problem.cols + problem.col;
  const vertical = () => `${problem.verticalStart}から ${problem.verticalNumber}ばんめ`;
  const horizontal = () => `${problem.horizontalStart}から ${problem.horizontalNumber}ばんめ`;
  function makeProblem() {
    stopSpeech();
    const n = Number($('size').value), level = Number($('level').value);
    const singleVertical = level === 1 && rand(2) === 0;
    const rows = level === 1 && !singleVertical ? 1 : n;
    const cols = singleVertical ? 1 : n;
    const row = rand(rows), col = rand(cols);
    const verticalStart = rand(2) ? 'うえ' : 'した';
    const horizontalStart = rand(2) ? 'ひだり' : 'みぎ';
    problem = {n, level, rows, cols, row, col, singleVertical, verticalStart, horizontalStart,
      verticalNumber: verticalStart === 'うえ' ? row + 1 : rows - row,
      horizontalNumber: horizontalStart === 'ひだり' ? col + 1 : cols - col,
      hintsEnabled: $('hintMode').value !== 'none',
      items: Array.from({length: rows * cols}, () => fruits[rand(fruits.length)])};
    state = {phase: level === 2 ? 'row' : 'cell', chosen: null, hintStep: 0, assisted: false, outcome: null};
    render();
    message(state.phase === 'row' ? 'だんを ひとつ えらんでね。' : 'マスを ひとつ えらんでね。');
    if ($('speak').checked) speakQuestion();
  }
  function message(text) { $('status').textContent = text; }
  function render() {
    const done = state.outcome !== null;
    $('question').textContent = problem.level === 1
      ? `${problem.singleVertical ? vertical() : horizontal()}は どこ？`
      : state.phase === 'row' ? `${vertical()}の だんを えらぼう`
      : problem.level === 2 ? `この だんで、${horizontal()}は どこ？`
      : `${vertical()}、${horizontal()}は どこ？`;
    $('retained').textContent = problem.level === 2 && state.phase === 'cell' ? `✓ ${vertical()}の だん` : '';
    $('stepLabel').textContent = done ? (state.outcome === 'revealed' ? 'こたえ' : 'せいかい')
      : `Lv.${problem.level} · ${state.phase === 'row' ? '① だんを えらぶ' : problem.level === 2 ? '② マスを えらぶ' : 'もんだい'}`;
    const board = $('board');
    board.innerHTML = '';
    board.style.gridTemplateColumns = `repeat(${problem.cols}, minmax(0, 1fr))`;
    board.classList.toggle('single-vertical', problem.singleVertical);
    if (state.phase === 'row') {
      for (let r = 0; r < problem.rows; r++) {
        const button = document.createElement('button');
        button.className = 'row-choice';
        button.type = 'button';
        button.setAttribute('aria-label', `うえから ${r + 1}ばんめの だん`);
        button.setAttribute('aria-pressed', String(state.chosen === r));
        button.classList.toggle('chosen', state.chosen === r);
        button.classList.toggle('row-hint', r === problem.row && (state.hintStep > 0 || done));
        button.disabled = done;
        for (let c = 0; c < problem.cols; c++) {
          const fruit = document.createElement('span'); fruit.textContent = problem.items[r * problem.cols + c]; button.appendChild(fruit);
        }
        button.addEventListener('click', () => select(r)); board.appendChild(button);
      }
    } else {
      problem.items.forEach((fruit, i) => {
        const button = document.createElement('button'), r = Math.floor(i / problem.cols);
        button.className = 'cell'; button.type = 'button'; button.textContent = fruit;
        button.setAttribute('aria-label', `うえから ${r + 1}ばんめ、ひだりから ${i % problem.cols + 1}ばんめ ${fruit}`);
        button.setAttribute('aria-pressed', String(state.chosen === i));
        button.classList.toggle('chosen', state.chosen === i);
        button.classList.toggle('row-hint', r === problem.row && (problem.level === 2 || (problem.level !== 1 && state.hintStep > 0)));
        button.classList.toggle('target', i === targetIndex() && (done || state.hintStep === 2));
        button.disabled = done || (problem.level === 2 && r !== problem.row);
        button.addEventListener('click', () => select(i)); board.appendChild(button);
      });
    }
    $('checkBtn').disabled = done || state.chosen === null;
    $('resetBtn').disabled = done || state.chosen === null;
    $('answerBtn').disabled = done;
    $('hintBtn').disabled = done || state.hintStep >= 2;
    $('hintBtn').classList.toggle('hidden', !problem.hintsEnabled);
    $('nextBtn').classList.toggle('primary', done);
  }
  function select(value) {
    if (state.outcome) return;
    state.chosen = value; render();
    message('これで よければ「こたえあわせ」を おしてね。');
  }
  function check() {
    if (state.outcome || state.chosen === null) return;
    const correct = state.chosen === (state.phase === 'row' ? problem.row : targetIndex());
    if (!correct) { message('もういちど えらんでみよう。'); return; }
    if (state.phase === 'row') {
      state.phase = 'cell'; state.chosen = null; state.hintStep = 0;
      render(); message('この だんの なかで えらぼう。');
      if ($('speak').checked) speakQuestion();
    } else {
      state.outcome = state.assisted ? 'assisted' : 'independent';
      render(); message('せいかい！ よく みつけたね 🎉');
    }
  }
  function hint() {
    if (state.outcome || !problem.hintsEnabled || state.hintStep >= 2) return;
    state.assisted = true;
    state.hintStep = state.phase === 'row' ? 2 : state.hintStep + 1;
    render();
    message(state.phase === 'row' ? 'わくの ついた だんを みてね。' : state.hintStep === 2
      ? 'ふとい わくの マスを みてね。' : problem.level === 1
      ? `${problem.singleVertical ? problem.verticalStart : problem.horizontalStart}から、ひとつずつ かぞえよう。`
      : `わくの ついた だんで、${problem.horizontalStart}から かぞえよう。`);
  }
  function reveal() {
    if (state.outcome) return;
    state.outcome = 'revealed'; state.phase = 'cell'; state.chosen = null;
    render(); message('ふとい わくの マスが こたえだよ。');
  }
  function stopSpeech() { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); }
  function speakQuestion() {
    if (!('speechSynthesis' in window)) { message('この ブラウザでは よみあげが つかえません。'); return; }
    stopSpeech();
    const utterance = new SpeechSynthesisUtterance($('question').textContent);
    utterance.lang = 'ja-JP'; utterance.rate = 0.85;
    window.speechSynthesis.speak(utterance);
  }
  ['size','level','hintMode'].forEach(id => $(id).addEventListener('change', makeProblem));
  $('speak').addEventListener('change', () => $('speak').checked ? speakQuestion() : stopSpeech());
  $('listenBtn').addEventListener('click', speakQuestion);
  $('hintBtn').addEventListener('click', hint);
  $('checkBtn').addEventListener('click', check);
  $('nextBtn').addEventListener('click', makeProblem);
  $('resetBtn').addEventListener('click', () => {
    if (state.outcome) return;
    state.chosen = null; render(); message('えらびなおしてね。');
  });
  $('answerBtn').addEventListener('click', reveal);
  makeProblem();
})();
</script>
</body>
</html>
