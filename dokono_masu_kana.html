<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>どこのマスかな？</title>
<style>
  :root { color-scheme: light; --green:#27865a; --ink:#26332d; --soft:#f3f7f3; --line:#d6e2d8; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 14px 36px; font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; color:var(--ink); background:#fbfcfa; }
  main { max-width:680px; margin:auto; }
  h1 { font-size:clamp(1.4rem,5vw,2rem); margin:0 0 6px; }
  .sub { color:#65736a; margin:0 0 20px; font-size:.95rem; }
  .panel { background:white; border:1px solid var(--line); border-radius:18px; padding:16px; margin:14px 0; box-shadow:0 2px 8px #1d43200a; }
  .settings { display:flex; flex-wrap:wrap; align-items:center; gap:12px 18px; }
  label { display:flex; gap:7px; align-items:center; font-size:.95rem; }
  select, button { font:inherit; border-radius:10px; border:1px solid #bdcfc1; padding:9px 12px; background:white; color:var(--ink); }
  button { cursor:pointer; font-weight:650; }
  button.primary { background:var(--green); border-color:var(--green); color:white; }
  button:focus-visible, select:focus-visible { outline:3px solid #a9d8bb; outline-offset:2px; }
  .question { text-align:center; font-size:clamp(1.2rem,4vw,1.55rem); font-weight:750; line-height:1.6; }
  .board-wrap { display:flex; justify-content:center; padding:8px 0 14px; }
  .board { display:grid; gap:7px; width:min(100%,440px); }
  .cell { aspect-ratio:1; border:2px solid #d8e4da; border-radius:13px; background:#fff; display:grid; place-items:center; font-size:clamp(2rem,9vw,3.2rem); cursor:pointer; user-select:none; transition:background .15s,border-color .15s,transform .15s; }
  .cell:active { transform:scale(.97); }
  .cell.row-hint { background:#e7f4e9; border-color:#79b98b; }
  .cell.target { background:#c9ebd2; border:3px solid var(--green); }
  .cell.chosen { outline:4px solid #f0b84b; outline-offset:1px; }
  .cell:disabled { cursor:default; }
  .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; }
  .status { min-height:2.6em; text-align:center; font-weight:650; margin:12px 0 0; }
  .help { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
  .muted { color:#66736a; font-size:.88rem; }
  .step { display:inline-block; border-radius:999px; padding:4px 10px; background:#eef5ef; color:#286342; font-size:.85rem; font-weight:700; margin-bottom:8px; }
  .hidden { display:none !important; }
  footer { text-align:center; color:#7a867e; font-size:.8rem; margin-top:20px; }
</style>
</head>
<body>
<main>
  <h1>どこのマスかな？</h1>
  <p class="sub">たて・よこの場所を組み合わせて、くだものを見つけよう。</p>

  <section class="panel settings" aria-label="問題の設定">
    <label>マスの大きさ
      <select id="size"><option value="3">3 × 3</option><option value="4">4 × 4</option></select>
    </label>
    <label>ヒント
      <select id="hintMode"><option value="step">段階的にヒントを出す</option><option value="none">ヒントなし</option></select>
    </label>
    <label><input id="speak" type="checkbox"> 問題を読み上げる</label>
  </section>

  <section class="panel">
    <div class="step" id="stepLabel">もんだい</div>
    <div class="question" id="question" aria-live="polite">上から2ばんめ、左から3ばんめはどこ？</div>
    <div class="board-wrap"><div class="board" id="board" aria-label="くだもののマス目"></div></div>
    <div class="actions">
      <button id="hintBtn">ヒント</button>
      <button class="primary" id="checkBtn">こたえあわせ</button>
      <button id="nextBtn">つぎのもんだい</button>
    </div>
    <p class="status" id="status" aria-live="polite">答えだと思うマスをタップしてね。</p>
    <div class="help">
      <button id="resetBtn">えらびなおす</button>
      <button id="answerBtn">こたえを見る</button>
    </div>
  </section>

  <section class="panel">
    <strong>ヒントの使い方</strong>
    <p class="muted" style="margin-bottom:0">1回目：指定された「段」を色で示します。<br>2回目：その段の中で、指定された「列」を示します。<br>ヒントなしにも切り替えられます。</p>
  </section>
  <footer>問題は毎回ランダムに作られます。何度でも遊べます。</footer>
</main>
<script>
(() => {
  const fruits = ["🍎","🍐","🍊","🍋","🍌","🍉","🍇","🍓","🫐","🍒","🍑","🥝","🍍","🥭","🥥","🍈"];
  const $ = id => document.getElementById(id);
  let n = 3, row = 0, col = 0, chosen = null, hintStep = 0, items = [], solved = false, verticalStart, horizontalStart, outcome = null;

  function rand(max) { return Math.floor(Math.random() * max); }
  function makeProblem() {
    n = Number($("size").value);
    row = rand(n); col = rand(n); chosen = null; hintStep = 0; solved = false; outcome = null;
    ["checkBtn", "resetBtn", "answerBtn", "hintBtn"].forEach(id => $(id).disabled = false);
    items = Array.from({length:n*n}, () => fruits[rand(fruits.length)]);
    $("board").style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    $("board").innerHTML = "";
    items.forEach((fruit, i) => {
      const cell = document.createElement("button");
      cell.className = "cell";
      cell.type = "button";
      cell.textContent = fruit;
      cell.setAttribute("aria-label", `${Math.floor(i/n)+1}行${i%n+1}列 ${fruit}`);
      cell.addEventListener("click", () => selectCell(i));
      $("board").appendChild(cell);
    });
    verticalStart = Math.random() < .5 ? "上" : "下";
    horizontalStart = Math.random() < .5 ? "左" : "右";
    const vr = verticalStart === "上" ? row + 1 : n - row;
    const hc = horizontalStart === "左" ? col + 1 : n - col;
    $("question").textContent = `${verticalStart}から${vr}ばんめ、${horizontalStart}から${hc}ばんめはどこ？`;
    $("stepLabel").textContent = "もんだい";
    $("status").textContent = "答えだと思うマスをタップしてね。";
    $("hintBtn").classList.toggle("hidden", $("hintMode").value === "none");
    if ($("speak").checked) speakQuestion();
  }
  function selectCell(i) {
    if (solved) return;
    chosen = i;
    [...$("board").children].forEach((el, j) => el.classList.toggle("chosen", j === i));
    $("status").textContent = "このマスでよければ「こたえあわせ」を押してね。";
  }
  function targetIndex() { return row*n + col; }
  function finish(result) {
    solved = true; outcome = result;
    ["checkBtn", "resetBtn", "answerBtn", "hintBtn"].forEach(id => $(id).disabled = true);
  }
  function check() {
    if (solved) return;
    if (chosen === null) { $("status").textContent = "まず、マスをひとつタップしてね。"; return; }
    if (chosen === targetIndex()) {
      finish(hintStep ? "assisted" : "independent");
      $("status").textContent = "せいかい！ よく見つけたね 🎉";
      $("stepLabel").textContent = "せいかい";
      [...$("board").children].forEach((el, i) => { el.disabled = true; if (i === targetIndex()) el.classList.add("target"); });
    } else {
      $("status").textContent = "おしい！ もう一度、場所を考えてみよう。";
    }
  }
  function hint() {
    if (solved) return;
    const cells = [...$("board").children];
    if (hintStep >= 2) return;
    cells.forEach(el => el.classList.remove("row-hint","target"));
    if (hintStep === 0) {
      for (let c=0;c<n;c++) cells[row*n+c].classList.add("row-hint");
      $("stepLabel").textContent = "ヒント 1";
      $("status").textContent = `${verticalStart}から数えた段を色で示したよ。この段を見てね。`;
      hintStep = 1;
    } else if (hintStep === 1) {
      for (let c=0;c<n;c++) cells[row*n+c].classList.add("row-hint");
      cells[targetIndex()].classList.add("target");
      $("stepLabel").textContent = "ヒント 2";
      $("status").textContent = `${horizontalStart}から数えた場所も示したよ。`;
      hintStep = 2;
    } else {
      $("status").textContent = "色のついたマスが答えだよ。";
    }
  }
  function reveal() {
    if (solved) return;
    finish("revealed");
    [...$("board").children].forEach((el, i) => {
      el.disabled = true;
      if (i === targetIndex()) el.classList.add("target");
    });
    $("stepLabel").textContent = "こたえ";
    $("status").textContent = `答えは ${$("board").children[targetIndex()].textContent} でした。`;
  }
  function speakQuestion() {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance($("question").textContent));
  }
  $("size").addEventListener("change", makeProblem);
  $("hintMode").addEventListener("change", makeProblem);
  $("speak").addEventListener("change", () => { if ($("speak").checked) speakQuestion(); });
  $("hintBtn").addEventListener("click", hint);
  $("checkBtn").addEventListener("click", check);
  $("nextBtn").addEventListener("click", makeProblem);
  $("resetBtn").addEventListener("click", () => {
    if (solved) return;
    chosen = null;
    [...$("board").children].forEach(el => el.classList.remove("chosen"));
    $("status").textContent = "えらびなおしてね。";
  });
  $("answerBtn").addEventListener("click", reveal);
  makeProblem();
})();
</script>
</body>
</html>
